[workspace]
members = ["oracle-core", "oracle-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
sha2 = "0.10"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
