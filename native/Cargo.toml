[workspace]
members = ["oracle-execution", "oracle-core", "oracle-python", "oracle-reasoning", "oracle-incremental", "oracle-science", "oracle-bio", "oracle-statistics", "oracle-logic", "oracle-host"]
default-members = ["oracle-core", "oracle-python"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
nix = { version = "0.30", features = ["fs", "signal", "process", "poll"] }

[profile.release]
lto = "thin"
codegen-units = 1
