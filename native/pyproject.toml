[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oracle-native-runtime"
version = "0.2.0"
requires-python = ">=3.12"
description = "Shared Oracle data and transactional native execution"

[tool.maturin]
manifest-path = "oracle-python/Cargo.toml"
module-name = "oracle_native"
